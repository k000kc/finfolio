spring.application.name=finfolio

# Подключение к PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/finfolio
spring.datasource.username=finfolio_user
spring.datasource.password=finfolio_password

# Путь к главному файлу миграций Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Hibernate только проверяет соответствие таблиц и Java-классов (таблицы создает Liquibase)
spring.jpa.hibernate.ddl-auto=validate

# Вывод SQL-запросов в консоль
spring.jpa.show-sql=true